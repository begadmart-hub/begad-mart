<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BE S-MART</title>
  <style>
    body { font-family: Arial; padding: 0; background: #f5f5f5; margin: 0; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-top: 30px; padding: 0 20px 40px 20px; max-width: 1200px; margin: 30px auto; }
    .card { background: white; border-radius: 10px; padding: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); text-align: center; transition: transform 0.2s; }
    .card:hover { transform: translateY(-5px); }
    .card img { width: 100%; height: 200px; object-fit: cover; border-radius: 8px; }
    .card h3 { margin: 10px 0 5px 0; font-size: 16px; color: #333; }
    .price { font-size: 18px; font-weight: bold; color: #2e7d32; }
    .btn { width: 100%; padding: 10px; background: #2e7d32; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
    .btn:hover { background: #1b5e20; }
  </style>
</head>
<body>

  <!-- 1. WELCOME SECTION -->
  <div id="home" style="background: linear-gradient(135deg, #2e7d32 0%, #66bb6a 100%); color: white; text-align: center; padding: 80px 20px;">
    <h1 style="font-size: 50px; margin: 0; color: white;">BE S-MART</h1>
    <p style="font-size: 20px;">Smart Shopping, Smarter Living</p>
    <a href="#products" style="display: inline-block; margin-top: 20px; padding: 15px 30px; background: #ffeb3b; color: #000; text-decoration: none; border-radius: 8px; font-weight: bold;">এখনই কেনাকাটা করুন</a>
    <a href="#seller" style="display: inline-block; margin-top: 20px; margin-left: 10px; padding: 15px 30px; background: transparent; color: white; text-decoration: none; border-radius: 8px; border: 2px solid white; font-weight: bold;">Seller Login</a>
  </div>

  <!-- 2. STICKY MENU -->
  <div style="position: sticky; top: 0; background: white; padding: 15px; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); z-index: 1000; border-bottom: 2px solid #2e7d32;">
    <a href="#home" style="margin: 0 15px; text-decoration: none; color: #2e7d32; font-weight: bold;">Home</a>
    <a href="#products" style="margin: 0 15px; text-decoration: none; color: #2e7d32; font-weight: bold;">Products</a>
    <a href="#cart" style="margin: 0 15px; text-decoration: none; color: #2e7d32; font-weight: bold;">Cart 🛒</a>
    <a href="#contact" style="margin: 0 15px; text-decoration: none; color: #2e7d32; font-weight: bold;">Contact</a>
  </div>

  <!-- 3. PRODUCT SECTION -->
  <div id="products">
    <h1 style="padding-top: 40px; text-align: center; color: #2e7d32;">আমাদের সকল পণ্য</h1>
    <p style="text-align: center; color: #555; font-size: 18px;">প্রাকৃতিক ও ঘরোয়া খাদ্যপণ্য</p>
    
    <div class="grid" id="product-grid"></div>
  </div>

  <!-- 4. FOOTER -->
  <div id="contact" style="background: #2e7d32; color: white; text-align: center; padding: 30px 20px;">
    <h3>BE S-MART</h3>
    <p>যোগাযোগ: Rampurhat, West Bengal</p>
    <p>© 2026 BE S-MART. All Rights Reserved.</p>
  </div>

  <script>
    const products = [
      { id: 1, name: "Aamer Achar - Mango Pickle", price: 180, image: "https://i.imgur.com/abc123.jpg" },
      { id: 2, name: "Aamer Jam - Mango Jam", price: 220, image: "https://i.imgur.com/abc123.jpg" },
      { id: 3, name: "Amloki Morobba - Amla Murabba", price: 250, image: "https://i.imgur.com/abc123.jpg" },
      { id: 4, name: "Amloki Candy - Amla Candy", price: 150, image: "https://i.imgur.com/abc123.jpg" },
      { id: 5, name: "Karamcha Achar - Karonda Pickle", price: 160, image: "https://i.imgur.com/abc123.jpg" },
      { id: 6, name: "Lebu Achar - Lemon Pickle", price: 140, image: "https://i.imgur.com/abc123.jpg" },
      { id: 7, name: "Kamranga Jam - Starfruit Jam", price: 210, image: "https://i.imgur.com/abc123.jpg" },
      { id: 8, name: "Gota Masala - Whole Spices", price: 120, image: "https://i.imgur.com/abc123.jpg" },
      { id: 9, name: "Guro Masala - Ground Spices", price: 100, image: "https://i.imgur.com/abc123.jpg" },
      { id: 10, name: "Herbal Panio - Lemon Mint Drink", price: 80, image: "https://i.imgur.com/abc123.jpg" },
      { id: 11, name: "Holud Guro - Turmeric Powder", price: 70, image: "https://i.imgur.com/abc123.jpg" },
      { id: 12, name: "Lal Mirich Guro - Red Chilli Powder", price: 90, image: "https://i.imgur.com/abc123.jpg" }
    ];

    const grid = document.getElementById('product-grid');
    products.forEach(p => {
      grid.innerHTML += `
        <div class="card">
          <img src="${p.image}" alt="${p.name}">
          <h3>${p.name}</h3>
          <p class="price">₹${p.price}</p>
          <button class="btn">Add to Cart</button>
        </div>
      `;
    });
  </script>
</body>
</html>
